[workspace]
resolver = "2"
package.edition = "2024"

members = [
	"rust/*",
	"rust_misc/*",
	"rust_extra/*",
	"rust/backbeat_app/src-tauri",
	"rust_extra/backbeat_vf_app/src-tauri"
]
# `backbeat_app` is a Tauri app and has a bunch of non-rust in it.
# Lol special handling lol
exclude = ["rust/backbeat_app", "rust_extra/backbeat_vf_app"]

[profile.release]
opt-level = 3
lto = true
# makes colossally faster/smaller libraries at the cost of compile time
codegen-units = 1

# We enable everything at mega strict mode. Warns
# are fine for local dev, but banned for CI.
#
# I manually turn off lints that I think we don't need.
# This is more opt-out, than opt-in.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# this rule sucks
manual_range_contains = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
use_self = "deny"
new_without_default = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
map_unwrap_or = "allow"
panic = "allow"
redundant_pub_crate = "allow"
doc_markdown = "allow"
expect_used = "allow"
cast_possible_wrap = "allow"
match_same_arms = "allow"
too_many_lines = "allow"
redundant_closure_for_method_calls = "allow"
multiple_crate_versions = "allow"
significant_drop_tightening = "allow"
too_long_first_doc_paragraph = "allow"
cargo_common_metadata = "allow"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.dependencies]

# backbeat!
backbeat_core = { version = "0.5.1", path = "rust/backbeat_core" }
backbeat_server_client = { version = "0.5.1", path = "rust/backbeat_server_client" }
backbeat_sdk = { version = "0.5.1", path = "rust/backbeat_sdk" }
backbeat_store_config = { version = "0.5.1", path = "rust/backbeat_store_config" }

# Extra backbeat stuff - apps and other extra integrations.
backbeat_inspector = { version = "0.5.1", path = "rust_extra/backbeat_inspector" }
backbeat_packager = { version = "0.5.1", path = "rust_extra/backbeat_packager" }
backbeat_vf_config = { path = "rust_extra/backbeat_vf_config" }
backbeat_vf_fs = { path = "rust_extra/backbeat_vf_fs" }
backbeat_vf_mountd = { path = "rust_extra/backbeat_vf_mountd" }
backbeat_vf_fuse = { path = "rust_extra/backbeat_vf_fuse" }
backbeat_vf_winfsp = { path = "rust_extra/backbeat_vf_winfsp" }
backbeat_server = { version = "0.5.1", path = "rust_extra/backbeat_server" }

# Other small packages.
rg_formats = { version = "0.2.0", path = "rust_misc/rg_formats" }
media_file_info = "1.0.0"

# async
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = "0.7.12"
futures = "0.3.31"
futures-lite = "2.6.1"

# logging
tracing = "0.1.37"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# serialization
serde = { version = "1.0.204", features = ["derive", "rc"] }
serde_json = "1.0.120"
serde_with = "3"
ts-rs = "10.1.0"

# error handling
thiserror = "2.0.6"
anyhow = "1.0.86"

strum = "0.26.2"

# filesystem
fs-err = "3.0.0"
tempfile = "3.27.0"
assert_cmd = "2"
predicates = "3"

# OS interfacing
directories = "5.0.1"

# database
sqlx = { version = "0.9.0", default-features = false, features = [
	"runtime-tokio",
	"sqlite-unbundled",
	"derive",
	"macros",
	"chrono",
	"uuid",
] }

# web stuff
axum = "0.8.1"
reqwest = { version = "0.12.8", features = ["stream", "gzip"] }

# gui
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
open = "5"

# cli
unicode-width = "0.2"
clap = { version = "4.5.20", features = ["derive", "color"] }
clap_complete = "4"
indicatif = "0.17"

# other
tinyfilter = "1.0.0"
parking_lot = "0.12"
arc-swap = "1.7"
encoding_rs = "0.8.34"
derive_more = "2"
regex = "1.11.0"
walkdir = "2.5.0"
flate2 = "1.0.34"
tar = "0.4"
zip = "8.6.0"
moka = { version = "0.12.8", features = ["sync"] }
mime_guess = "2.0.5"
hex = "0.4.3"
lexical = "7.0.0"
sha2 = "0.10.6"
md-5 = "0.10.6"
dashmap = "6.1.0"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
uuid = { version = "1.26.0", features = ["v4"] }

# testing
criterion = { version = "0.5.1", default-features = false }
pretty_assertions = "1.3.0"

# build / ffi
vergen-git2 = "9"
libc = { version = "0.2", default-features = false }
url = "2.5"
toml = "1.1.2"
base64-simd = "0.8.0"
bytes = "1.11.1"
fuser = "0.17"
cbindgen = "0.29"
http = "1"
nix = "0.31"
tower = "0.5"
chrono = "0.4.45"
