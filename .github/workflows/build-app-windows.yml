name: Build Backbeat App (Windows)

run-name: Build Windows app from ${{ github.ref_name }} at ${{ github.sha }}

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build Windows x86-64 installers
        runs-on: windows-2022
        timeout-minutes: 60
        env:
            CARGO_INCREMENTAL: "0"
            SQLITE3_INCLUDE_DIR: ${{ github.workspace }}/target/package-sqlite/include
            SQLITE3_LIB_DIR: ${{ github.workspace }}/target/package-sqlite/lib
            SQLITE3_STATIC: "0"

        steps:
            - name: Check out repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
              with:
                  toolchain: 1.96.0
                  targets: x86_64-pc-windows-msvc

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
              with:
                  key: app-windows-x86-64

            - name: Build package SQLite
              shell: cmd
              run: |
                  for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_INSTALL=%%i"
                  call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
                  mkdir target\package-sqlite\include
                  mkdir target\package-sqlite\lib
                  curl.exe --fail --location --silent --show-error https://sqlite.org/2024/sqlite-amalgamation-3460000.zip --output target\package-sqlite\sqlite.zip
                  certutil -hashfile target\package-sqlite\sqlite.zip SHA256 | findstr /i "712a7d09d2a22652fb06a49af516e051979a3984adb067da86760e60ed51a7f5" || exit /b 1
                  tar -xf target\package-sqlite\sqlite.zip -C target\package-sqlite
                  copy target\package-sqlite\sqlite-amalgamation-3460000\sqlite3.h target\package-sqlite\include\sqlite3.h
                  cl /nologo /O2 /MD /c /DSQLITE_ENABLE_COLUMN_METADATA /DSQLITE_ENABLE_FTS5 /DSQLITE_THREADSAFE=1 /DSQLITE_USE_URI=1 target\package-sqlite\sqlite-amalgamation-3460000\sqlite3.c /Fotarget\package-sqlite\sqlite3.obj || exit /b 1
                  lib /nologo /OUT:target\package-sqlite\lib\sqlite3.lib target\package-sqlite\sqlite3.obj || exit /b 1

            - name: Install SQLx CLI
              uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
              with:
                  tool: sqlx-cli@0.9.0

            - name: Install Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

            - name: Install JavaScript dependencies
              run: bun install --frozen-lockfile

            - name: Build Windows installers
              working-directory: rust/backbeat_app
              run: bun tauri build --ci --bundles msi,nsis

            - name: Generate checksums
              shell: pwsh
              run: |
                  Push-Location target/release/bundle
                  $files = Get-ChildItem msi, nsis -Recurse -File |
                    Where-Object { $_.Extension -in '.msi', '.exe' } |
                    Sort-Object FullName
                  if ($files.Count -eq 0) {
                    throw 'No Windows installers were produced.'
                  }
                  $lines = foreach ($file in $files) {
                    $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
                    $relative = Resolve-Path -Relative $file.FullName
                    "$hash  $relative"
                  }
                  $lines | Set-Content -Encoding ascii SHA256SUMS
                  Pop-Location

            - name: Upload Windows installers
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backbeat-app-windows-x86-64-${{ github.sha }}
                  path: |
                      target/release/bundle/msi/*.msi
                      target/release/bundle/nsis/*-setup.exe
                      target/release/bundle/SHA256SUMS
                  archive: true
                  if-no-files-found: error
                  retention-days: 14
