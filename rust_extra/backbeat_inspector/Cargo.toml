[package]
name = "backbeat_inspector"
version = "0.5.1"
edition.workspace = true
authors = ["zkldi <zkldi@proton.me>"]
keywords = ["backbeat", "rhythm-game"]
categories = []
repository = "https://github.com/zkldi/backbeat"
license = "GPL-3.0"
readme = "README.md"
description = "A tool that can inspect `.bb` files and extract useful metadata"

[features]
sqlx = ["dep:sqlx"]
ts = ["dep:ts-rs"]

[dependencies]
backbeat_core = { workspace = true }
rg_formats = { workspace = true }
md-5 = { workspace = true }

serde = { workspace = true }
serde_with = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
sqlx = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["md-5"]
