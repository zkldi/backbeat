[package]
name = "bkb"
version = "0.5.1"
edition.workspace = true
authors = ["zkldi <zkldi@proton.me>"]
readme = "README.md"
license = "GPL-3.0"
description = "A CLI for interacting with backbeat."
repository = "https://github.com/zkldi/backbeat"

[[bin]]
name = "bkb"
path = "src/main.rs"

[dependencies]
backbeat_core = { workspace = true }
backbeat_inspector = { workspace = true }
backbeat_packager = { workspace = true }
backbeat_sdk = { workspace = true }
backbeat_store_config = { workspace = true }
backbeat_server = { workspace = true }
media_file_info = { workspace = true }

clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
fs-err = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
walkdir = { workspace = true }
indicatif = { workspace = true }
unicode-width = { workspace = true }
directories = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
backbeat_core = { workspace = true }
