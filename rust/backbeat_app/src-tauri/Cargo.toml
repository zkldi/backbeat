[package]
name = "backbeat_app"
version = "0.5.1"
edition.workspace = true
authors = ["zkldi <zkldi@proton.me>"]
keywords = ["backbeat", "rhythm-game"]
categories = []
repository = "https://github.com/zkldi/backbeat"
license = "MIT"
readme = "README.md"
description = "A desktop application for managing your Backbeat store"

[lib]
# Tauri mobile targets need a cdylib; also expose a normal rlib for the `main.rs` binary.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Backbeat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }
vergen-git2 = { workspace = true }

[dependencies]
backbeat_core = { workspace = true }
backbeat_sdk = { workspace = true }
backbeat_store_config = { workspace = true }
base64-simd = { workspace = true }
arc-swap = { workspace = true }

tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
open = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true }
url = { workspace = true }
percent-encoding = "2.3.2"
mime_guess.workspace = true
backbeat_server_client.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
# `serde_json` is referenced by the `tauri::generate_context!` macro expansion,
# which cargo-machete's source scan can't see.
ignored = ["serde_json"]
